# Model B -- PRUNED U-Net + Dice only. The compressed baseline: the DAMAGE (master §0b).
#
# B is what pruning does when nothing is done to protect boundary geometry. P1 predicts it
# keeps Dice largely intact while losing Boundary F1 and HD95; P2 predicts the loss
# concentrates in the high-curvature bin. Everything C claims is measured against B.
#
# B, B' and C load the SAME channel mask and differ ONLY in the loss block below.

run:
  name: B_pruned                              # [ENGINEERING] master §0b
  description: "Pruned U-Net, Dice only (compressed baseline / damage)"

model:
  architecture: unet                          # [PAPER-family] master §7
  in_channels: 1                              # [ENGINEERING]
  out_channels: 1                             # [ENGINEERING] FROZEN, master §7
  encoder_channels: [64, 128, 256, 512]       # [ASSUMPTION] A08 -- pre-pruning widths
  bottleneck_channels: 1024                   # [ASSUMPTION] A08
  decoder_channels: [512, 256, 128, 64]       # [ASSUMPTION] A08
  bilinear_upsample: false                    # [ASSUMPTION]
  final_activation: null                      # [ENGINEERING] FROZEN, master §7
  batchnorm: true                             # [ENGINEERING]

loss:
  region:
    name: dice                                # [PAPER] master §8
    smooth: 1.0e-5                            # [PAPER] master §8
    alpha: 1.0                                # [ENGINEERING] identical to B'/C
  boundary:
    name: null                                # [ENGINEERING] no boundary term -- this IS the baseline
    beta: 0.0                                 # [ENGINEERING]

pruning:
  enabled: true                               # [ENGINEERING] master §9
  ratio: 0.5                                  # [ENGINEERING] master §9; 0.7 via override
  source_checkpoint: checkpoints/A_dcr/best.pt        # [ENGINEERING] master §9
  # LOADS the shared mask; never computes its own. This is what makes B/B'/C the same network.
  channel_mask: checkpoints/channel_masks/ratio_0.5.json   # [ENGINEERING] master §9
  reprune: false                              # [ENGINEERING] master §9 -- prune ONCE per ratio
  recalibrate_batchnorm: true                 # [ENGINEERING] master §9

finetune:
  # Identical across B/B'/C (master §10) -- only the loss differs.
  from_pruned_base: true                      # [ENGINEERING] master §9

source_labels:
  pruning.channel_mask: "[ENGINEERING] master §9 -- shared with B' and C"
  pruning.ratio: "[ENGINEERING] master §9"
  loss.boundary.name: "[ENGINEERING] deliberately absent"
