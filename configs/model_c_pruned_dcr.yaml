# Model C -- PRUNED U-Net + Dice + dCR. The PROPOSED method: the RECOVERY (master §0b).
#
# C is the study's answer to the frozen research question: can dCR recover the boundary
# geometry that structured pruning destroys? It is compared against
#   B  (same network, no boundary term)        -> P3/P4: is there recovery, and is it
#                                                 concentrated in the high-curvature bin?
#   B' (same network, flat boundary term)      -> P5: is the recovery CURVATURE-SPECIFIC?
#
# Every loss field below except the curvature terms is byte-identical to B', and the pruning
# block is byte-identical to both B and B'. That is deliberate: it is what allows any observed
# difference to be attributed to curvature-awareness rather than to the network or the setup.

run:
  name: C_pruned_dcr                          # [ENGINEERING] master §0b
  description: "Pruned U-Net, Dice + dCR (proposed recovery)"

model:
  architecture: unet                          # [PAPER-family] master §7
  in_channels: 1                              # [ENGINEERING]
  out_channels: 1                             # [ENGINEERING] FROZEN, master §7
  encoder_channels: [64, 128, 256, 512]       # [ASSUMPTION] A08
  bottleneck_channels: 1024                   # [ASSUMPTION] A08
  decoder_channels: [512, 256, 128, 64]       # [ASSUMPTION] A08
  bilinear_upsample: false                    # [ASSUMPTION]
  final_activation: null                      # [ENGINEERING] FROZEN, master §7
  batchnorm: true                             # [ENGINEERING]

loss:
  region:
    name: dice                                # [PAPER] master §8
    smooth: 1.0e-5                            # [PAPER] master §8
    alpha: 1.0                                # [ENGINEERING] identical to B/B'
  boundary:
    # *** SURROGATE, NOT THE PAPER'S EQUATION *** -- A06, src/losses/dcr_loss.py.
    # Results here are results for "a curvature-weighted boundary loss in the spirit of dCR".
    # REPLACE THE MOMENT THE REAL EQUATION ARRIVES (Golden Rule 8) and re-run every phase
    # that depends on it.
    name: dcr                                 # [ASSUMPTION] A06
    beta: 1.0                                 # [ASSUMPTION] A06 -- B' is calibrated to match this
    band_width: 3                             # [ASSUMPTION] A06 -- MUST equal B'
    # Weighting strength. gamma=0 collapses dCR EXACTLY to GenericBoundaryLoss, which is why
    # the control is an exact special case of the treatment rather than a lookalike.
    curvature_gamma: 1.0                      # [ASSUMPTION] A06
    curvature_weight_power: 1.0               # [ASSUMPTION] A06
    # THE SWAP POINT for the paper's real equation: register it and name it here (A06).
    # "sobel_magnitude" is master §8's literal wording, kept for ablation but NOT default --
    # |grad p| is ~constant along a boundary and cannot tell a corner from a straight edge,
    # which would make dCR numerically almost identical to the flat control and void P5.
    curvature_proxy: sobel_levelset           # [ASSUMPTION] A06
    # MANDATORY for hard binary targets: curvature of an unsmoothed binary mask is the second
    # derivative of a step function and reports pixel staircase, not shape. MEASURED: at
    # sigma=0 a corner scores 0.317 vs 0.333 on a straight edge (no discrimination); at
    # sigma=2 the straight edge is EXACTLY 0.000. Matches A27's value for the same reason.
    curvature_smooth_sigma: 2.0               # [ASSUMPTION] A06
    normalise_weights: true                   # [ENGINEERING]
    curvature_source: target                  # [ASSUMPTION] A06 -- identical to Model A

pruning:
  enabled: true                               # [ENGINEERING] master §9
  ratio: 0.5                                  # [ENGINEERING] master §9
  source_checkpoint: checkpoints/A_dcr/best.pt              # [ENGINEERING] master §9
  channel_mask: checkpoints/channel_masks/ratio_0.5.json    # [ENGINEERING] SAME mask as B and B'
  reprune: false                              # [ENGINEERING] master §9
  recalibrate_batchnorm: true                 # [ENGINEERING] master §9

finetune:
  from_pruned_base: true                      # [ENGINEERING] master §9

source_labels:
  loss.boundary.name: "[ASSUMPTION] A06 -- SURROGATE, not the paper's equation"
  loss.boundary.beta: "[ASSUMPTION] A06 -- reference for B' gradient calibration"
  loss.boundary.band_width: "[ASSUMPTION] A06 -- MUST equal Model B'"
  loss.boundary.curvature_proxy: "[ASSUMPTION] A06 -- swap point for the real equation"
  loss.boundary.curvature_gamma: "[ASSUMPTION] A06"
  pruning.channel_mask: "[ENGINEERING] master §9 -- shared with B and B'"
