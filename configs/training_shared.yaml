# Shared training configuration -- composed into EVERY run (src/config.py).
#
# Master §10 requires B, B' and C to use IDENTICAL optimiser, LR, seeds and augmentation, with
# only the loss differing. Keeping those values here, in one file that all three compose from,
# makes that guarantee structural rather than something to remember.
#
# Source labels: [PAPER] [OFFICIAL] [LITERATURE] [ENGINEERING] [ASSUMPTION]

data:
  train_split: data/splits/train.csv          # [ENGINEERING] written once in Phase 1
  test_split: data/splits/test.csv            # [ENGINEERING]
  preprocess_manifest: data/processed/preprocess_manifest.csv   # [ENGINEERING]
  curvature_bins: data/curvature/curvature_bins.csv             # [ENGINEERING] write-once, §11
  image_size: 1024                            # [ASSUMPTION] A19 -- measured cell radii drove this
  in_channels: 1                              # [ENGINEERING] greyscale bright-field
  return_instances: true                      # [ENGINEERING] A14 -- needed by §11 and §12
  num_workers: 0                              # [ENGINEERING] A18 -- raise on Kaggle
  pin_memory: true                            # [ENGINEERING]
  # Validation is carved out of TRAIN only. The test split is touched exactly once, at final
  # evaluation; using it for checkpoint selection would leak it into the result.
  val_fraction: 0.15                          # [ASSUMPTION] not recoverable from the paper (A02)
  val_split_seed: 42                          # [ASSUMPTION] A15
  val_group_aware: true                       # [ENGINEERING] A11 -- same leakage rule as Phase 1

normalization:
  method: percentile                          # [LITERATURE] A20 -- CSBDeep/StarDist convention
  pmin: 1.0                                   # [LITERATURE] A20
  pmax: 99.8                                  # [LITERATURE] A20
  clip: false                                 # [LITERATURE] A20 -- CSBDeep default

augmentation:
  enabled: true                               # [ASSUMPTION] A23
  # FROZEN across B/B'/C (master §10). Only model_init_seed varies across the 3 seeds.
  seed: 1234                                  # [ENGINEERING] master §10
  p_hflip: 0.5                                # [ASSUMPTION] A23
  p_vflip: 0.5                                # [ASSUMPTION] A23
  p_rot90: 0.5                                # [ASSUMPTION] A23
  p_affine: 0.5                               # [ASSUMPTION] A23
  max_rotation_deg: 15.0                      # [ASSUMPTION] A23
  max_scale_delta: 0.10                       # [ASSUMPTION] A23
  max_shift_frac: 0.05                        # [ASSUMPTION] A23
  # Deliberately mild and infrequent: this study MEASURES curvature, and a strong elastic
  # field would manufacture the very signal §11 bins on.
  p_elastic: 0.25                             # [ASSUMPTION] A23
  elastic_alpha: 12.0                         # [ASSUMPTION] A23
  elastic_sigma: 16.0                         # [ASSUMPTION] A23
  p_brightness_contrast: 0.5                  # [ASSUMPTION] A23
  max_brightness_delta: 0.10                  # [ASSUMPTION] A23
  max_contrast_delta: 0.10                    # [ASSUMPTION] A23
  p_gaussian_noise: 0.25                      # [ASSUMPTION] A23
  noise_std: 0.02                             # [ASSUMPTION] A23

optimizer:
  name: adam                                  # [ASSUMPTION] A04
  lr: 1.0e-4                                  # [ASSUMPTION] A04
  weight_decay: 1.0e-5                        # [ASSUMPTION] A04
  betas: [0.9, 0.999]                         # [ASSUMPTION] A04 -- torch defaults

scheduler:
  name: reduce_on_plateau                     # [ASSUMPTION] master §10
  # Master §10 says "val Boundary F1" without naming a tolerance, but §6 defines TWO (2px and
  # 5px). The metric key must therefore be explicit or it silently resolves to nothing.
  # 2px is chosen [ASSUMPTION A31]: it is the stricter tolerance and so the more sensitive to
  # exactly the fine boundary damage P1/P3 are about.
  monitor: val_boundary_f1_2px                # [ASSUMPTION] A31 -- NOT Dice, see below
  mode: max                                   # [ENGINEERING]
  factor: 0.5                                 # [ASSUMPTION]
  patience: 7                                 # [ASSUMPTION]
  min_lr: 1.0e-6                              # [ASSUMPTION]

training:
  # A28: master §10 assumed batch 8, but A19's 1024x1024 input makes that ~16 GB of
  # activations on the frozen U-Net -- it will OOM a 16 GB T4. Confirm on the first Kaggle run.
  batch_size: 4                               # [ASSUMPTION] A28
  gradient_accumulation_steps: 1              # [ASSUMPTION] A28 -- raise for a larger effective batch
  max_epochs: 100                             # [ASSUMPTION] A05
  mixed_precision: false                      # [ENGINEERING] master §10 -- OFF for final runs
  grad_clip_norm: null                        # [ASSUMPTION] none unless instability appears
  log_gradient_norms: true                    # [ENGINEERING] master §10

early_stopping:
  enabled: true                               # [ENGINEERING] master §10
  # Selection is on BOUNDARY F1, not Dice. P1 predicts Dice stays intact while boundaries
  # degrade, so selecting on Dice would be nearly blind to the quantity under study.
  monitor: val_boundary_f1_2px                # [ASSUMPTION] A31 (tolerance), master §10
  mode: max                                   # [ENGINEERING]
  patience: 15                                # [ASSUMPTION] master §10
  min_delta: 0.0                              # [ASSUMPTION]

checkpointing:
  save_best: true                             # [ENGINEERING] master §10
  save_final: true                            # [ENGINEERING] master §10
  monitor: val_boundary_f1_2px                # [ASSUMPTION] A31, master §10
  mode: max                                   # [ENGINEERING]
  dir: checkpoints                            # [ENGINEERING] master §15
  record_hash: true                           # [ENGINEERING] master §14 traceability

determinism:
  # Load-bearing, not hygiene: the study's claim is that B/B'/C differ ONLY in loss.
  enabled: true                               # [ENGINEERING] master §10
  cudnn_deterministic: true                   # [ENGINEERING] master §10
  cudnn_benchmark: false                      # [ENGINEERING] master §10
  use_deterministic_algorithms: true          # [ENGINEERING] master §10
  warn_only: false                            # [ENGINEERING] fail loudly on a nondeterministic op

seeds:
  # Master §10: three seeds, logged SEPARATELY, varying ONLY model initialisation.
  model_init_seeds: [1, 2, 3]                 # [ASSUMPTION] values arbitrary, count is master §10

logging:
  tensorboard: true                           # [ENGINEERING] master §10
  csv: true                                   # [ENGINEERING] master §10
  dir: logs                                   # [ENGINEERING] master §15
  experiment_log: results/tables/experiment_log.csv   # [ENGINEERING] master §10

source_labels:
  optimizer.lr: "[ASSUMPTION] A04"
  training.batch_size: "[ASSUMPTION] A28"
  training.max_epochs: "[ASSUMPTION] A05"
  early_stopping.patience: "[ASSUMPTION] A05/master §10"
  early_stopping.monitor: "[ASSUMPTION] A31 -- 2px tolerance chosen among §6's two"
  augmentation.seed: "[ENGINEERING] master §10 -- shared across B/B'/C"
  normalization.method: "[LITERATURE] A20"
  data.image_size: "[ASSUMPTION] A19"
